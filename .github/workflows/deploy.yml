name: Deploy DriverLink Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Cloudflare
        run: npx wrangler@4 deploy worker.js --name driverlink-api --compatibility-date 2026-11-04
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7eef466418fb0ea040d16404c916ae5f
